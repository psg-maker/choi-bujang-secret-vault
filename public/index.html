<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth { margin: 26px 0; padding: 22px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 22px; }
    .auth label { display: block; margin: 14px 0 6px; }
    .auth input, .auth textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #71869c; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth textarea { min-height: 140px; resize: vertical; }
    li span { white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-actions { display: flex; gap: 10px; margin-top: 14px; }
    .note-actions button { padding: 8px 14px; border: 1px solid #71869c; border-radius: 7px; background: #263d53; color: #ecf4ff; font: inherit; cursor: pointer; }
    .note-actions .delete-note { color: #ffbec8; }
    .note-actions button:focus-visible { outline: 3px solid #8ad8df; outline-offset: 3px; }
    .auth button { margin-top: 16px; padding: 11px 20px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .5; cursor: wait; }
    .auth :focus-visible { outline: 3px solid #8ad8df; outline-offset: 3px; }
    .auth-error { color: #ffbec8; }
    .auth-error:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 확인</div>
    <h1>자료실</h1>
    <p>가상 자료를 공개 파일에서 분리했습니다.</p>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 로그인</h2>
      <p id="auth-status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-submit" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <noscript><p>로그인하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    </section>
    <div id="login-notice" class="notice">자료를 보려면 로그인해 주세요.</div>
    <section id="note-editor" class="auth" aria-labelledby="note-heading" hidden>
      <h2 id="note-heading">내 가상 메모</h2>
      <p>실습용 가상 내용만 작성해 주세요.</p>
      <form id="note-form">
        <label for="note-title">제목</label>
        <input id="note-title" name="title" maxlength="200" required>
        <label for="note-body">본문</label>
        <textarea id="note-body" name="body" maxlength="10000"></textarea>
        <button id="note-save" type="submit">메모 추가</button>
        <button id="note-cancel" type="button" hidden>수정 취소</button>
      </form>
      <p id="note-status" role="status" aria-live="polite"></p>
      <p id="note-error" class="auth-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>자료를 보려면 로그인해 주세요.</li></ul>
  </main>
  <script type="module" src="/login.mjs"></script>
</body>
</html>
